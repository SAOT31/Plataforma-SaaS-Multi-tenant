<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Store</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background-color: #f1f5f9;
      color: #1e293b;
    }
    .store-container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 36px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }
    header {
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    article {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background: #fafafa;
    }
    .product-price {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin: 10px 0;
    }
    .btn-buy {
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <main class="store-container">
    <header>
      <h1 style="margin: 0; font-size: 26px;">Apex Store</h1>
      <p style="margin: 6px 0 0; color: #64748b; font-size: 14px;">Storefront Catalog</p>
    </header>

    <section>
      <h2>Featured Products</h2>
      <div class="product-grid">
        <article>
          <h3>Sport Runner Pro</h3>
          <p style="color: #64748b; font-size: 13px;">High performance running shoes.</p>
          <div class="product-price">$89.99 USD</div>
          <button type="button" class="btn-buy">Buy Now</button>
        </article>
        <article>
          <h3>Wireless Headphones X</h3>
          <p style="color: #64748b; font-size: 13px;">Active noise cancelling with 40h battery.</p>
          <div class="product-price">$129.99 USD</div>
          <button type="button" class="btn-buy">Buy Now</button>
        </article>
      </div>
    </section>
  </main>

 
<script 
  src="http://localhost:5050/widget/pqrs-widget.js" 
  data-tenant="11111111-1111-1111-1111-111111111111"
  data-api="http://localhost:5050">
</script>

</body>
</html>
