name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            if [ ! -d "/home/${{ secrets.VPS_USERNAME }}/Plataforma-SaaS-Multi-tenant" ]; then
              git clone https://github.com/SAOT31/Plataforma-SaaS-Multi-tenant.git /home/${{ secrets.VPS_USERNAME }}/Plataforma-SaaS-Multi-tenant
            fi
            cd /home/${{ secrets.VPS_USERNAME }}/Plataforma-SaaS-Multi-tenant
            git fetch --all
            git reset --hard origin/main
            
            # Create .env file for production
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
            echo "POSTGRES_DB=pqrs_saas" >> .env
            echo "POSTGRES_USER=postgres" >> .env
            echo "POSTGRES_PASSWORD=postgrespassword" >> .env
            
            docker compose down
            docker compose up --build -d
